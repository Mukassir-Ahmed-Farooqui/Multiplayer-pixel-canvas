apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixelboard-server
  namespace: pixel-canvas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixelboard-server
  template:
    metadata:
      labels:
        app: pixelboard-server
    spec:
      containers:
      - name: server
        image: moonknightmaf/pixelboard-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
